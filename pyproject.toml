[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docgraph"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.27.2",
    "rich>=15.0.0",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "Pillow>=12.3.0",
    "ollama>=0.6.3",
    "pydantic>=2.13.5",
    "lightrag-hku>=1.5.7",
    "networkx>=3.7",
    "python-dotenv>=1.2.4"
]

[project.scripts]
docgraph = "cli:app"

[project.optional-dependencies]
dev = [
    "pylint",
    "pytest",
    "pytest-cov",
    "pytest-mock"
]

[tool.coverage.run]
omit = [
    "src/check_env.py",
]

[tool.setuptools]
py-modules = ["cli"]
packages = ["src"]
